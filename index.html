<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ever-Wind</title>
<meta name="description" content="Ever-Wind 的个人主页" />
<meta name="theme-color" content="#f7f6f3" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Ever-Wind" />
<meta property="og:description" content="Ever-Wind 的个人主页" />
<meta property="og:url" content="https://everwind.top/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%2314161a'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='54' fill='%23f7f6f3' text-anchor='middle'%3EEW%3C/text%3E%3C/svg%3E" />
<script>
  (function () {
    var d = document.documentElement;
    try {
      var mode = localStorage.getItem("themeMode") || "auto";
      var dark = mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      d.dataset.theme = dark ? "dark" : "light";
      d.dataset.mode = mode;
    } catch (e) {
      d.dataset.theme = "light";
    }
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --rail: 232px;
    --bg: #f7f6f3;
    --ink: #14161a;
    --muted: #61656e;
    --faint: #8b8f98;
    --line: rgba(20, 22, 26, 0.12);
    --line-soft: rgba(20, 22, 26, 0.07);
    --accent: #1f6feb;
    --chip: rgba(20, 22, 26, 0.045);
    --dot: #22a06b;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111318;
    --ink: #dfe2e7;
    --muted: #9ba2ad;
    --faint: #737a86;
    --line: rgba(223, 226, 231, 0.14);
    --line-soft: rgba(223, 226, 231, 0.08);
    --accent: #82aefc;
    --chip: rgba(255, 255, 255, 0.05);
    --dot: #48c494;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100dvh;
    color: var(--ink);
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }
  ::selection { background: rgba(31, 111, 235, 0.18); }
  a { color: inherit; }

  /* ---------- 左侧栏：贴着屏幕左上角 ---------- */
  .rail {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: var(--rail);
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 22px 16px 18px;
    border-right: 1px solid var(--line);
    background: var(--bg);
    overflow-y: auto;
    z-index: 30;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 26px 6px;
    color: var(--ink);
    text-decoration: none;
    font-size: 12.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .brand-whale { width: 30px; height: 22px; object-fit: contain; }
  html[data-theme="dark"] .brand-whale { filter: invert(1); }

  .side-title {
    margin: 0 0 8px 6px;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .cats { display: flex; flex-direction: column; gap: 2px; }
  .cat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .cat:hover { background: var(--chip); color: var(--ink); }
  .cat.active { background: var(--chip); color: var(--ink); font-weight: 600; }
  .cat .n { font-size: 11.5px; color: var(--faint); font-weight: 400; }

  .rail-foot {
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    color: var(--faint);
  }
  .rail-foot a { color: var(--muted); text-decoration: none; }
  .rail-foot a:hover { color: var(--ink); }

  .who {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: auto;
    padding: 18px 6px 4px;
  }
  .who img { width: 27px; height: 20px; object-fit: contain; }
  html[data-theme="dark"] .who img { filter: invert(1); }
  .who b { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); letter-spacing: 0.01em; }
  .who span { display: block; margin-top: 1px; font-size: 10.5px; color: var(--faint); letter-spacing: 0.04em; }

  /* ---------- 主区 ---------- */
  .main {
    margin-left: var(--rail);
    min-height: 100dvh;
    padding: 0 clamp(24px, 5vw, 72px) 80px;
  }
  .inner { max-width: 780px; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 16px 0 12px;
    background: var(--bg);
  }
  .tool-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    color: var(--muted);
    font-size: 13px;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .tool-btn:hover { color: var(--ink); border-color: var(--muted); }
  .tool-btn svg { width: 14px; height: 14px; fill: currentColor; }

  .palette-pop {
    position: absolute;
    top: 58px;
    right: 0;
    z-index: 40;
    width: 232px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--bg);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
  }
  .pop-title {
    margin: 0 0 10px;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .theme-opts { display: flex; flex-direction: column; gap: 2px; }
  .theme-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .theme-opt:hover { background: var(--chip); color: var(--ink); }
  .theme-opt[aria-checked="true"] { background: var(--chip); color: var(--ink); font-weight: 600; }
  .theme-opt svg {
    width: 15px; height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .theme-opt .tick { margin-left: auto; color: var(--accent); font-size: 12px; }

  /* ---------- 首屏 ---------- */
  .hero { padding: clamp(30px, 5vw, 56px) 0 clamp(26px, 4vw, 40px); }
  .kicker {
    margin: 0 0 14px;
    font-size: 11.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--faint);
  }
  h1 {
    margin: 0 0 18px;
    font-size: clamp(40px, 5.4vw, 66px);
    line-height: 1.02;
    letter-spacing: -0.038em;
    font-weight: 640;
  }
  .lede {
    margin: 0;
    max-width: 42ch;
    font-size: clamp(15.5px, 1.4vw, 17.5px);
    line-height: 1.8;
    color: var(--muted);
    white-space: pre-line;
  }
  .now {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 10px;
    margin: clamp(26px, 4vw, 38px) 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line-soft);
    font-size: 14px;
    line-height: 1.7;
    color: var(--muted);
  }
  .now-who {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .now-who img { width: 18px; height: 13px; display: block; }
  [data-theme="dark"] .now-who img { filter: invert(1); }
  .now-label {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .now-label::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--dot);
    box-shadow: 0 0 0 3px rgba(34, 160, 107, 0.16);
    animation: breathe 3.2s ease-in-out infinite;
  }
  .now-text { color: var(--ink); }

  /* ---------- 文章 ---------- */
  .entries { list-style: none; margin: 0; padding: 0; }
  .entry {
    padding: clamp(22px, 3vw, 30px) 0;
    border-top: 1px solid var(--line-soft);
    animation: reveal 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .entries .entry:first-child { border-top: 1px solid var(--line); }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 3px rgba(34, 160, 107, 0.16); }
    50% { box-shadow: 0 0 0 5px rgba(34, 160, 107, 0.05); }
  }
  .entry-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--faint);
    letter-spacing: 0.04em;
    flex-wrap: wrap;
  }
  .entry-meta time { font-variant-numeric: tabular-nums; }
  .badge {
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .byline { display: inline-flex; align-items: center; gap: 7px; }
  .byline img { width: 22px; height: 16px; object-fit: contain; }
  html[data-theme="dark"] .byline img { filter: invert(1); }
  .byline b { font-weight: 600; font-size: 12px; color: var(--muted); }

  .entry h3 {
    margin: 0 0 14px;
    font-size: clamp(19px, 2vw, 24px);
    line-height: 1.35;
    letter-spacing: -0.02em;
    font-weight: 620;
  }
  .cover {
    margin: 0 0 18px;
    border-radius: 12px;
    overflow: hidden;
    line-height: 0;
    background: var(--chip);
  }
  .cover svg, .cover img { display: block; width: 100%; height: auto; }
  .entry-body {
    font-size: clamp(15.5px, 1vw + 12px, 16.5px);
    line-height: 1.9;
    color: var(--muted);
    max-width: 68ch;
    word-break: break-word;
  }
  .entry-body p { margin: 0 0 0.85em; }
  .entry-body p:last-child { margin-bottom: 0; }
  .entry-body h2, .entry-body h3, .entry-body h4, .entry-body h5 {
    margin: 1.3em 0 0.5em;
    color: var(--ink);
    font-size: 1.02em;
  }
  .entry-body ul { margin: 0 0 0.85em; padding-left: 1.2em; }
  .entry-body li { margin: 0.25em 0; }
  .entry-body a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .entry-body strong { color: var(--ink); font-weight: 600; }
  .entry-body img { max-width: 100%; border-radius: 10px; margin: 0.4em 0; }
  .entry-body code {
    padding: 0.1em 0.38em;
    border-radius: 5px;
    background: var(--chip);
    font-size: 0.92em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .empty {
    padding: 26px 0 4px;
    border-top: 1px solid var(--line);
    color: var(--faint);
    font-size: 14.5px;
    line-height: 1.7;
  }

  .foot {
    margin-top: clamp(48px, 7vw, 80px);
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--faint);
  }
  .foot p { margin: 0; max-width: 46ch; line-height: 1.75; }
  .admin-link { display: none; }
  body.is-admin .admin-link { display: inline; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .entry { animation: none; }
    .now-label::before { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }

  /* ---------- 窄屏：左栏折成顶部一条 ---------- */
  @media (max-width: 860px) {
    .rail {
      position: static;
      width: auto;
      height: auto;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .brand { margin: 0 10px 0 0; }
    .side-title, .rail-foot { display: none; }
    .cats { flex-direction: row; flex-wrap: wrap; gap: 8px; }
    .cat {
      width: auto;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12.5px;
      gap: 6px;
    }
    .main { margin-left: 0; padding: 0 16px 64px; }
    .topbar { padding: 12px 0 10px; }
    .who { margin: 0 0 0 auto; padding: 0 2px; }
    .who span { display: none; }
  }
</style>
</head>
<body id="top">

<aside class="rail">
  <a class="brand" href="#top">
    <img class="brand-whale" data-whale alt="" />
    <span>Ever-Wind</span>
  </a>
  <p class="side-title">分类</p>
  <nav class="cats" id="catList"></nav>
  <div class="who">
    <img data-whale alt="" />
    <div>
      <b>DeepSeek</b>
      <span>AI · 一起写的</span>
    </div>
  </div>
  <div class="rail-foot">
    <a href="admin.html">登录后台</a>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="tool-btn" id="paletteBtn" type="button" aria-expanded="false" aria-label="切换外观">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8h1.6A4.8 4.8 0 0 0 21 9.9C21 6.1 17 3 12 3zm-4.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3.5-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
      外观
    </button>
    <a class="tool-btn" href="admin.html">登录</a>
    <div class="palette-pop" id="palettePop" hidden>
      <p class="pop-title">外观</p>
      <div class="theme-opts" id="themeOpts"></div>
    </div>
  </div>

  <div class="inner">
    <section class="hero">
      <p class="kicker">Personal site</p>
      <h1 id="siteName">Ever-Wind</h1>
      <p class="lede" id="siteTagline">hello everyone</p>
      <p class="now">
        <span class="now-who"><img data-whale alt="" /> DeepSeek</span>
        <span class="now-label">现在</span>
        <span class="now-text" id="siteNow">在改这个站，等你的下一张截图。</span>
      </p>
    </section>

    <ol class="entries" id="postList"></ol>
    <p class="empty" id="emptyHint" hidden>这个分类下还没有文章。</p>

    <footer class="foot">
      <p>这个站是一点点搭起来的，用的都是免费的东西。写点东西、记点事，就够了。</p>
      <p>
        <a href="admin.html" class="admin-link">后台</a>
        <span>everwind.top</span>
        <span aria-hidden="true"> · </span>
        <span>&copy; <span id="year">2026</span></span>
      </p>
    </footer>
  </div>
</main>

<script src="md.js"></script>
<script>
  (function () {
    var root = document.documentElement;
    var allPosts = [];
    var currentCat = "全部";

    /* ---------- 外观：白天 / 夜间 / 跟随系统 ---------- */
    var MODES = [
      {
        id: "light",
        label: "白天",
        icon: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/>'
      },
      {
        id: "dark",
        label: "夜间",
        icon: '<path d="M20 14.4A8.3 8.3 0 0 1 9.6 4 8.3 8.3 0 1 0 20 14.4z"/>'
      },
      {
        id: "auto",
        label: "跟随系统",
        icon: '<rect x="2.8" y="4.2" width="18.4" height="12.2" rx="2"/><path d="M8.4 20h7.2M12 16.4V20"/>'
      }
    ];

    var mq = window.matchMedia("(prefers-color-scheme: dark)");

    function savedMode() {
      try {
        var m = localStorage.getItem("themeMode");
        return m === "light" || m === "dark" ? m : "auto";
      } catch (e) {
        return "auto";
      }
    }

    function applyMode(mode, remember) {
      var dark = mode === "dark" || (mode === "auto" && mq.matches);
      root.dataset.theme = dark ? "dark" : "light";
      root.dataset.mode = mode;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#111318" : "#f7f6f3");
      var opts = document.querySelectorAll(".theme-opt");
      Array.prototype.forEach.call(opts, function (btn) {
        var on = btn.getAttribute("data-mode") === mode;
        btn.setAttribute("aria-checked", on ? "true" : "false");
        var tick = btn.querySelector(".tick");
        if (tick) tick.textContent = on ? "✓" : "";
      });
      if (remember) {
        try { localStorage.setItem("themeMode", mode); } catch (e) {}
      }
    }

    (function initTheme() {
      var box = document.getElementById("themeOpts");
      MODES.forEach(function (mode) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "theme-opt";
        b.setAttribute("role", "menuitemradio");
        b.setAttribute("data-mode", mode.id);
        b.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true">' + mode.icon + "</svg>" +
          "<span></span><span class='tick'></span>";
        b.children[1].textContent = mode.label;
        b.addEventListener("click", function () {
          applyMode(mode.id, true);
          document.getElementById("palettePop").hidden = true;
        });
        box.appendChild(b);
      });

      var btn = document.getElementById("paletteBtn");
      var pop = document.getElementById("palettePop");
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        pop.hidden = !pop.hidden;
        btn.setAttribute("aria-expanded", String(!pop.hidden));
      });
      pop.addEventListener("click", function (e) { e.stopPropagation(); });
      document.addEventListener("click", function () { pop.hidden = true; });

      applyMode(savedMode(), false);

      var onSystemChange = function () {
        if (savedMode() === "auto") applyMode("auto", false);
      };
      if (mq.addEventListener) mq.addEventListener("change", onSystemChange);
      else if (mq.addListener) mq.addListener(onSystemChange);
    })();

    /* ---------- 渲染 ---------- */
    var year = document.getElementById("year");
    if (year) year.textContent = String(new Date().getFullYear());

    function fmtDate(value) {
      if (!value) return "";
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
      return m ? m[1] + "." + m[2] + "." + m[3] : value;
    }

    function tagsOf(post) {
      if (Array.isArray(post.tags) && post.tags.length) return post.tags;
      return ["未分类"];
    }

    function renderSite(site) {
      if (!site) return;
      if (site.name) {
        document.getElementById("siteName").textContent = site.name;
        document.title = site.name;
        var og = document.querySelector('meta[property="og:title"]');
        if (og) og.setAttribute("content", site.name);
      }
      if (site.tagline != null) document.getElementById("siteTagline").textContent = site.tagline;
      if (site.now) document.getElementById("siteNow").textContent = site.now;
    }

    function renderCats() {
      var counts = {};
      allPosts.forEach(function (p) {
        tagsOf(p).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
      });
      var list = document.getElementById("catList");
      list.innerHTML = "";
      var names = ["全部"].concat(Object.keys(counts).sort(function (a, b) {
        return counts[b] - counts[a];
      }));
      names.forEach(function (name) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "cat" + (name === currentCat ? " active" : "");
        b.innerHTML = "<span></span><span class='n'></span>";
        b.firstChild.textContent = name;
        b.lastChild.textContent = name === "全部" ? allPosts.length : counts[name];
        b.addEventListener("click", function () {
          currentCat = name;
          renderCats();
          renderPosts();
        });
        list.appendChild(b);
      });
    }

    function renderPosts() {
      var list = document.getElementById("postList");
      var empty = document.getElementById("emptyHint");
      var shown = allPosts.filter(function (p) {
        return currentCat === "全部" || tagsOf(p).indexOf(currentCat) >= 0;
      });
      list.innerHTML = "";
      if (!shown.length) {
        empty.hidden = false;
        return;
      }
      empty.hidden = true;

      shown.forEach(function (post, i) {
        var li = document.createElement("li");
        li.className = "entry";
        li.style.animationDelay = Math.min(i, 6) * 55 + "ms";

        var meta = document.createElement("div");
        meta.className = "entry-meta";
        if (post.ai) {
          var by = document.createElement("span");
          by.className = "byline";
          by.innerHTML = '<img src="' + WHALE_SRC + '" alt="" /><b>DeepSeek</b>';
          meta.appendChild(by);
        }
        if (post.date) {
          var time = document.createElement("time");
          time.textContent = fmtDate(post.date);
          meta.appendChild(time);
        }
        if (post.private) {
          var badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "私密";
          meta.appendChild(badge);
        }
        li.appendChild(meta);

        var title = document.createElement("h3");
        title.textContent = post.title;
        li.appendChild(title);

        if (post.cover && COVERS[post.cover]) {
          var cover = document.createElement("div");
          cover.className = "cover";
          cover.innerHTML = COVERS[post.cover];
          li.appendChild(cover);
        }

        var body = document.createElement("div");
        body.className = "entry-body";
        body.innerHTML = window.renderMarkdown(post.body || "");
        li.appendChild(body);

        list.appendChild(li);
      });
    }

    function apply(data) {
      if (!data) return;
      renderSite(data.site);
      allPosts = Array.isArray(data.posts) ? data.posts : [];
      renderCats();
      renderPosts();
      if (data.authed) document.body.classList.add("is-admin");
    }
